plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nomyra.farmaciademo'
    compileSdk 35

    defaultConfig {
        applicationId "com.nomyra.farmaciademo"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0-demo"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }
}

dependencies {
}
