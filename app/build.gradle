plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nomyra.farmaciademo'
    compileSdk 35

    signingConfigs {
        debug {
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    defaultConfig {
        applicationId "com.nomyra.farmaciademo"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.0.1-demo"
    }

    buildTypes {
        release {
            minifyEnabled false
        }

        debug {
            signingConfig signingConfigs.debug
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }
}

dependencies {
}
